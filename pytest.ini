[pytest]

# Default options: short tracebacks, quiet summary
addopts = --cov=sonic_platform --cov-report html --cov-report term-missing --cov-report xml --junitxml=test-results.xml -vv
# Discover tests for the shared platform code and QFX5241 package.
# Run with:  python3 -m pytest  (from the repo root or any test dir)
testpaths =
    tests

# Naming conventions
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Ignore build artifacts
norecursedirs = build .eggs *.egg-info __pycache__ .git
