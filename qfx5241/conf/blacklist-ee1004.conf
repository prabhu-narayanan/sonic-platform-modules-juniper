# QFX5241-64: ee1004 (DDR4 SPD EEPROM driver) claims the 0x36/0x37 page-select
# addresses on the CPU SMBus (i2c-0), which is the parent of the PCA9548 muxes.
# The I2C core then rejects VRM5 (0x36 on MUX1 channel 5) with -EBUSY. Keep it
# from autoloading; qfx5241_pre_device_create.py unbinds it on the boot that
# installs this file, when ee1004 is already bound.
blacklist ee1004
